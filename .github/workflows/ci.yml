name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Architecture, Unit Tests & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Clean Architecture & MVI boundaries
        run: python3 scripts/check_project.py

      - name: Fetch & patch Termux ARM64 ADB runtime
        run: python3 scripts/fetch_termux_adb.py

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: server/go.sum

      - name: Test Go Hexagonal Server
        run: |
          cd server
          CGO_ENABLED=0 go test -v ./internal/adapter/... ./internal/controller/... ./internal/usecase/...

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x app/gradlew

      - name: Run JVM unit tests & assemble Release APK
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon
        working-directory: app
