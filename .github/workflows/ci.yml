name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Architecture, Unit Tests & Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Clean Architecture & MVI boundaries
        run: python3 scripts/check_project.py

      - name: Fetch & patch Termux ARM64 ADB runtime
        run: python3 scripts/fetch_termux_adb.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run JVM unit tests & assemble Release APK
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon
